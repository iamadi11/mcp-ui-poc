name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift
        run: |
          curl -fsSL https://download.swift.org/swift-6.0.3-release/ubuntu2204/swift-6.0.3-RELEASE/swift-6.0.3-RELEASE-ubuntu22.04.tar.gz -o /tmp/swift.tgz
          sudo tar -xzf /tmp/swift.tgz -C /usr/share
          echo "/usr/share/swift-6.0.3-RELEASE-ubuntu22.04/usr/bin" >> $GITHUB_PATH
          sudo apt-get update && sudo apt-get install -y libncurses6 libcurl4
      - name: Test
        run: swift test
